<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизація</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="modal" id="modal">
        <div class="login-box">
            <button class="close" id="closeBtn">&times;</button>
            <h1>Авторизація</h1>
            <label>Введіть свій логін</label>
            <input type="text" placeholder="Введіть логін">
            <label>Введіть пароль</label>
            <div class="password-box">
                <input
                    type="password"
                    id="password"
                    placeholder="Введіть пароль"
                >
                <button type="button" id="showPassword">◉</button>
            </div>
            <label class="remember">
                <input type="checkbox">
                <span>Запам'ятати мене на цьому комп'ютері</span>
            </label>
            <button class="loginBtn">Увійти</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
