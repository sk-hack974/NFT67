<!doctype html>
<html lang="uk">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>TeenFlow — Реєстрація</title>
        <link rel="stylesheet" href="join.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
            rel="stylesheet" />
    </head>
    <body>
        <header class="navbar">
            <div class="logo">TeenFlow</div>
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="community.html">Community</a>
                <a href="about.html">About</a>
            </nav>
            <a href="join.html" class="btn-join">Join</a>
        </header>

        <main class="container">
            <div class="card">
                <div class="badge">• UA NFT COMMUNITY</div>
                <h1>Create Account.</h1>
                <p class="subtitle">Join the minimalist space for Ukrainian teen gamers.</p>

                <form class="auth-form">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" placeholder="gamer123" required />
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="your@email.com" required />
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="••••••••" required />
                    </div>

                    <button type="submit" class="btn-submit">Get Started</button>
                </form>

                <p class="footer-text">Already have an account? <a href="#">Log in</a></p>
            </div>
        </main>
    </body>
</html>
